# Generated by ~/.config/bspwm/apply.sh from settings.conf. Edit settings, not this file.
backend = "xrender";
vsync = false;
# corner-radius stays 0: picom's xrender backend leaves black wedges on opaque
# windows' rounded-off corners instead of revealing what's behind them (only
# the glx backend or picom 12+ handle this correctly). Rofi/polybar/dunst
# still look rounded because they paint their own ARGB shape via cairo.
corner-radius = 0;
# use-damage stays off: with the xrender backend picom's damage tracking goes stale when
# Termux:X11 resizes the screen (soft keyboard), leaving everything below the old height
# uncomposited - a window keeps its border but paints only its top part, wallpaper showing
# through below. Full repaints cost a little CPU; picom still only draws when something
# changes, so the practical cost is repainting the whole screen instead of a sub-region.
use-damage = false;
unredir-if-possible = false;
detect-client-opacity = true;
detect-rounded-corners = true;
log-level = "warn";

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.065;
fade-delta = 8;
no-fading-openclose = false;
fade-exclude = [ "class_g = 'Polybar'", "class_g = 'Dunst'", "class_g = 'gsimplecal'" ];

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [ "class_g = 'Polybar'", "class_g = 'Dunst'", "class_g = 'Rofi'", "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS" ];

wintypes: { dock = { shadow = false; }; tooltip = { fade = true; shadow = false; }; popup_menu = { shadow = false; }; dropdown_menu = { shadow = false; }; };
